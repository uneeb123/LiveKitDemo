services:
  whatsapp:
    build:
      context: ..
      dockerfile: Dockerfile.planner
    restart: unless-stopped
    env_file: ../.env.whatsapp
    environment:
      WHATSAPP_EVENT_DB: /data/whatsapp.sqlite3
    command: [".venv/bin/uvicorn", "max_agent.whatsapp_service:create_app", "--factory", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    ports:
      - "8080:8080"
    volumes:
      - whatsapp-events:/data
volumes:
  whatsapp-events:
